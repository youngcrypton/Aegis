name: AEGIS CI Protocol Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  foundry-tests:
    name: Foundry Smart Contracts & Invariant Proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Verify Solidity Compilation
        run: forge build --sizes

      - name: Run Unit & Invariant Test Suites
        run: forge test -vvv

  keeper-tests:
    name: Sentinel Keeper TypeScript Test Suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: keeper/package-lock.json

      - name: Install Dependencies
        working-directory: ./keeper
        run: npm ci

      - name: Run Keeper Jest Suites
        working-directory: ./keeper
        run: npm test

  frontend-truthfulness:
    name: Frontend Truthfulness & Live RPC Telemetry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Truthfulness Test Suite
        run: node test/test_frontend_truthfulness.js
