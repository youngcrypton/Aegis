<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1080" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B2A33"/>
      <stop offset="0.45" stop-color="#1C2238"/>
      <stop offset="1" stop-color="#0F2C2C"/>
    </linearGradient>

    <!-- Aurora Glows -->
    <radialGradient id="aurTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5CF0D6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#5CF0D6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A6FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C9A6FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Master AEGIS Blade Gradient (brand/logo/aegis-mark.svg) -->
    <linearGradient id="aegis-grad" gradientUnits="userSpaceOnUse" x1="27.70" y1="-13.51" x2="103.30" y2="141.51">
      <stop offset="0.00" stop-color="#1F0E4C"/>
      <stop offset="0.10" stop-color="#241056"/>
      <stop offset="0.20" stop-color="#40178D"/>
      <stop offset="0.30" stop-color="#5A1FC9"/>
      <stop offset="0.40" stop-color="#6928ED"/>
      <stop offset="0.50" stop-color="#642FEB"/>
      <stop offset="0.60" stop-color="#4C44CB"/>
      <stop offset="0.70" stop-color="#305EA5"/>
      <stop offset="0.80" stop-color="#157286"/>
      <stop offset="0.90" stop-color="#087B75"/>
      <stop offset="1.00" stop-color="#087E6D"/>
    </linearGradient>

    <!-- Fine Hairline Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(220, 230, 255, 0.035)" stroke-width="1"/>
    </pattern>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Marcellus&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap');
      .display { font-family: 'Marcellus', Georgia, serif; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#grid)"/>

  <!-- Ambient Glows -->
  <circle cx="540" cy="240" r="380" fill="url(#aurTeal)"/>
  <circle cx="200" cy="800" r="420" fill="url(#aurViolet)"/>

  <!-- Border Frame -->
  <rect x="36" y="36" width="1008" height="1008" rx="20" fill="none" stroke="rgba(220, 230, 255, 0.12)" stroke-width="1"/>

  <!-- Top Center: Master AEGIS Blade Mark -->
  <g transform="translate(450, 90) scale(1.38)">
    <polygon points="40.20,0.00 70.40,0.00 26.60,127.00 0.00,127.00" fill="url(#aegis-grad)"/>
    <polygon points="73.00,36.00 101.10,36.00 68.70,127.00 42.60,127.00" fill="url(#aegis-grad)"/>
    <polygon points="104.20,67.00 130.00,67.00 108.50,127.00 83.90,127.00" fill="url(#aegis-grad)"/>
  </g>

  <!-- Title & Proposition -->
  <text x="540" y="325" class="display" font-size="74" fill="#E8ECF8" text-anchor="middle" letter-spacing="4">Aegis</text>
  <text x="540" y="375" class="sans" font-size="28" font-weight="300" fill="#FFFFFF" text-anchor="middle">Hedge drawdowns. Never get liquidated.</text>
  <text x="540" y="415" class="sans" font-size="13" font-weight="600" fill="#5CF0D6" text-anchor="middle" letter-spacing="2.5">AUTONOMOUS DELTA HEDGING ON HYPERCORE &amp; ELYSIUM L2</text>

  <!-- 4 Feature Cards Grid -->
  <g transform="translate(80, 465)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="445" height="175" rx="16" fill="#22403F" stroke="rgba(220, 230, 255, 0.12)" stroke-width="1"/>
    <circle cx="36" cy="36" r="16" fill="#1C2238" stroke="rgba(92, 240, 214, 0.4)" stroke-width="1"/>
    <path d="M 32 36 L 40 36 M 36 32 L 36 40" stroke="#5CF0D6" stroke-width="2" stroke-linecap="round"/>
    <text x="66" y="41" class="sans" font-size="16" font-weight="600" fill="#E8ECF8">Autonomous Delta Hedging</text>
    <text x="36" y="80" class="sans" font-size="13.5" font-weight="400" fill="#A7AFCB">
      <tspan x="36" dy="0">Sub-second risk engine monitors oracle ticks</tspan>
      <tspan x="36" dy="22">and dispatches short perps to HyperCore CLOB</tspan>
      <tspan x="36" dy="22">without touching your collateral.</tspan>
    </text>

    <!-- Card 2 -->
    <rect x="475" y="0" width="445" height="175" rx="16" fill="#22403F" stroke="rgba(220, 230, 255, 0.12)" stroke-width="1"/>
    <circle cx="511" cy="36" r="16" fill="#1C2238" stroke="rgba(92, 240, 214, 0.4)" stroke-width="1"/>
    <path d="M 507 33 L 515 33 L 515 40 L 507 40 Z" fill="none" stroke="#5CF0D6" stroke-width="1.5"/>
    <text x="541" y="41" class="sans" font-size="16" font-weight="600" fill="#E8ECF8">100% Non-Custodial (INV-1)</text>
    <text x="511" y="80" class="sans" font-size="13.5" font-weight="400" fill="#A7AFCB">
      <tspan x="511" dy="0">Trade-only ephemeral session keys authorized</tspan>
      <tspan x="511" dy="22">strictly to open/close hedge orders. Zero</tspan>
      <tspan x="511" dy="22">withdrawal or transfer permissions.</tspan>
    </text>

    <!-- Card 3 -->
    <rect x="0" y="200" width="445" height="175" rx="16" fill="#22403F" stroke="rgba(220, 230, 255, 0.12)" stroke-width="1"/>
    <circle cx="36" cy="236" r="16" fill="#1C2238" stroke="rgba(92, 240, 214, 0.4)" stroke-width="1"/>
    <path d="M 30 236 L 42 236 M 38 230 L 42 236 L 38 242" fill="none" stroke="#5CF0D6" stroke-width="1.5" stroke-linecap="round"/>
    <text x="66" y="241" class="sans" font-size="16" font-weight="600" fill="#E8ECF8">Trailing Profit Lockout</text>
    <text x="36" y="280" class="sans" font-size="13.5" font-weight="400" fill="#A7AFCB">
      <tspan x="36" dy="0">Dynamically trails lowest bottom wicks.</tspan>
      <tspan x="36" dy="22">Automatically unwinds hedge on rebound,</tspan>
      <tspan x="36" dy="22">returning realized gains to the vault.</tspan>
    </text>

    <!-- Card 4 -->
    <rect x="475" y="200" width="445" height="175" rx="16" fill="#22403F" stroke="rgba(220, 230, 255, 0.12)" stroke-width="1"/>
    <circle cx="511" cy="236" r="16" fill="#1C2238" stroke="rgba(92, 240, 214, 0.4)" stroke-width="1"/>
    <circle cx="511" cy="236" r="6" fill="none" stroke="#5CF0D6" stroke-width="1.5"/>
    <text x="541" y="241" class="sans" font-size="16" font-weight="600" fill="#E8ECF8">Lite &amp; Pro Trading Modes</text>
    <text x="511" y="280" class="sans" font-size="13.5" font-weight="400" fill="#A7AFCB">
      <tspan x="511" dy="0">1-Click Lite Auto-Pilot with testnet presets</tspan>
      <tspan x="511" dy="22">for micro-capital (0.05 HYPE), plus high-spec</tspan>
      <tspan x="511" dy="22">Pro Terminal for institutional quants.</tspan>
    </text>
  </g>

  <!-- Technical Spec Bar -->
  <g transform="translate(80, 890)">
    <rect width="920" height="54" rx="12" fill="#1C2238" stroke="rgba(220, 230, 255, 0.12)" stroke-width="1"/>
    <text x="30" y="32" class="mono" font-size="12" fill="#5CF0D6">PRECOMPILE 0x0801 (ORACLE)</text>
    <text x="310" y="32" class="mono" font-size="12" fill="#C9A6FF">&bull; PRECOMPILE 0x0802 (CLOB WRITER)</text>
    <text x="640" y="32" class="mono" font-size="12" fill="#FFBE7A">&bull; $AEGIS REAL YIELD FLYWHEEL</text>
  </g>

  <!-- Bottom Announcement Bar -->
  <g transform="translate(80, 995)">
    <text x="0" y="0" class="sans" font-size="13" font-weight="700" fill="#E8ECF8" letter-spacing="1.5">OFFICIAL LAUNCH POST</text>
    <text x="920" y="0" class="sans" font-size="13" font-weight="600" fill="#5CF0D6" text-anchor="end">MORE PROTOCOL UPDATES COMING SOON</text>
  </g>
</svg>
