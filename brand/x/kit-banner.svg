<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1500" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B2A33"/>
      <stop offset="0.45" stop-color="#1C2238"/>
      <stop offset="1" stop-color="#0F2C2C"/>
    </linearGradient>
    <radialGradient id="aurA"><stop offset="0" stop-color="#5CF0D6" stop-opacity="0.22"/><stop offset="1" stop-color="#5CF0D6" stop-opacity="0"/></radialGradient>
    <radialGradient id="aurB"><stop offset="0" stop-color="#C9A6FF" stop-opacity="0.20"/><stop offset="1" stop-color="#C9A6FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="blade" x1="0" y1="9" x2="0" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF3E6"/>
      <stop offset="0.5" stop-color="#C9A6FF"/>
      <stop offset="1" stop-color="#5CF0D6"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="4" width="38" height="36">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1500" height="500" fill="url(#bg)"/>
  <circle cx="1300" cy="520" r="600" fill="url(#aurA)"/>
  <circle cx="180" cy="40" r="620" fill="url(#aurB)"/>

  <!-- Hedge motif from the landing chart: trigger line and the short curve -->
  <line x1="560" y1="432" x2="1500" y2="432" stroke="#FFBE7A" stroke-width="1" stroke-dasharray="5 6" opacity="0.6"/>
  <text x="560" y="420" font-family="Poppins, sans-serif" font-weight="400" font-size="14" fill="#FFBE7A" opacity="0.85">Trigger 1.20</text>
  <path d="M560 470 C760 470 880 478 1010 462 S1250 448 1500 452" fill="none" stroke="#5CF0D6" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

  <!-- Mark -->
  <g filter="url(#glow)" transform="translate(1010 88) scale(13) translate(-4 -9)">
    <path d="M4 34 L11 9 L16 9 L9 34 Z" fill="url(#blade)"/>
    <path d="M14 34 L20 16 L25 16 L19 34 Z" fill="url(#blade)"/>
    <path d="M23 34 L29 22 L34 22 L28 34 Z" fill="url(#blade)"/>
  </g>

  <!-- Type block: one left edge (x=262), hairline rule above the tagline -->
  <text x="262" y="252" font-family="Poppins, sans-serif" font-weight="700" font-size="104" letter-spacing="30" fill="#E8ECF8">AEGIS</text>
  <line x1="266" y1="280" x2="386" y2="280" stroke="#5CF0D6" stroke-width="1.5" opacity="0.8"/>
  <text x="266" y="330" font-family="Poppins, sans-serif" font-weight="300" font-size="34" fill="#E8ECF8">Hedge drawdowns. Never get liquidated.</text>
  <text x="266" y="372" font-family="Poppins, sans-serif" font-weight="500" font-size="20" letter-spacing="2.5" fill="#5CF0D6">AUTONOMOUS DELTA HEDGING ON HYPERCORE</text>
</svg>
