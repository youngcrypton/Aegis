<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <radialGradient id="violet">
      <stop offset="0" stop-color="#1C2238" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#1C2238" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal">
      <stop offset="0" stop-color="#07705F" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#07705F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="9" x2="0" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161230"/>
      <stop offset="0.5" stop-color="#1C2238"/>
      <stop offset="1" stop-color="#07705F"/>
    </linearGradient>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="4" width="38" height="36">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1500" height="500" fill="#FFFFFF"/>
  <circle cx="180" cy="40" r="620" fill="url(#violet)"/>
  <circle cx="1300" cy="520" r="560" fill="url(#teal)"/>
  <!-- Mark on the right -->
  <g filter="url(#soft)" transform="translate(1010 88) scale(13) translate(-4 -9)">
    <path d="M4 34 L11 9 L16 9 L9 34 Z" fill="url(#blade)"/>
    <path d="M14 34 L20 16 L25 16 L19 34 Z" fill="url(#blade)"/>
    <path d="M23 34 L29 22 L34 22 L28 34 Z" fill="url(#blade)"/>
  </g>
  <!-- Wordmark and lines, left of the mark, clear of the avatar -->
  <text x="262" y="252" font-family="Poppins, sans-serif" font-weight="700" font-size="104" letter-spacing="30" fill="#161230">AEGIS</text>
  <text x="266" y="318" font-family="Poppins, sans-serif" font-weight="300" font-size="34" fill="#161230">Hedge drawdowns. Never get liquidated.</text>
  <text x="266" y="366" font-family="Poppins, sans-serif" font-weight="500" font-size="20" letter-spacing="2.5" fill="#07705F">AUTONOMOUS DELTA HEDGING ON HYPERCORE</text>
</svg>
